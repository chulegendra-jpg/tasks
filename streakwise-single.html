/* =====================================================================
   STREAKWISE — design tokens
   ===================================================================== */
:root {
  --bg: #08090B; --s1: #111315; --s2: #191B1F; --s3: #23262B;
  --text: #fff; --muted: #8b9097; --faint: #5b6068; --line: rgba(255,255,255,.07);
  --accent: #B8F52A; --accent-ink: #0c1004; --accent-text: #B8F52A; --accent-soft: rgba(184,245,42,.12);
  --green: #3ddc6e; --yellow: #ffd23f; --orange: #ff9a3d; --red: #ff5a4d; --violet: #a78bfa; --indigo: #6d8bff;
  --panel: #0b0c0e;
  --nav-bg: rgba(226,227,223,.94); --nav-item: #fff; --nav-ink: #15171a; --nav-active: #0b0b0c; --nav-active-ink: #fff;
  --r-sm: 12px; --r-md: 20px; --r-lg: 28px; --r-xl: 36px;
  --font: 'Plus Jakarta Sans', 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --gut: 16px;
  --nav-room: calc(104px + env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
[data-theme="amoled"] { --bg: #000; --s1: #0a0a0b; --s2: #121214; --s3: #1b1c1f; --panel: #000; }
[data-theme="light"] {
  --bg: #EFF0EC; --s1: #fff; --s2: #F4F5F1; --s3: #E4E7DE; --text: #0e1013; --muted: #5f656d; --faint: #9aa0a8; --line: rgba(0,0,0,.09);
  --accent-text: #3d6600; --accent-soft: rgba(120,190,0,.16); --panel: #fff;
  --nav-bg: rgba(18,20,24,.94); --nav-item: #2b2e34; --nav-ink: #fff; --nav-active: #B8F52A; --nav-active-ink: #0c1004;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  background-image: radial-gradient(900px 420px at 50% -120px, rgba(184,245,42,.08), transparent 70%);
  background-repeat: no-repeat;
}
[data-theme="light"] body { background-image: radial-gradient(900px 420px at 50% -120px, rgba(150,220,0,.18), transparent 70%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .35; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }
.i { flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 10px; z-index: 99; font-weight: 700; }
.skip:focus { left: 8px; }
.muted { color: var(--muted); } .sm { font-size: 12.5px; } .accent-text { color: var(--accent-text); } .pad-b { padding-bottom: 14px; }
.clip2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fa { font-family: 'Vazirmatn', var(--font); font-weight: 600; font-size: .8em; color: var(--muted); margin-inline-start: 6px; }
[data-anim="off"] *, [data-anim="off"] *::before, [data-anim="off"] *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Layout ---------- */
#main { outline: none; }
.page { display: none; }
.page.active { display: block; animation: pageIn .5s var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 0 var(--gut) var(--nav-room); }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-lg); }
.page-head { font-size: clamp(31px, 9vw, 40px); line-height: 1.04; letter-spacing: -.035em; font-weight: 800; padding: calc(26px + env(safe-area-inset-top, 0px)) 0 18px; }
.page-head .sub { font-size: .7em; letter-spacing: -.025em; }
.page-head .flame { display: inline-block; vertical-align: -.1em; margin: 0 .06em; }
.page-head > svg, .page-head > img { display: inline-block; vertical-align: -.1em; }
.h-av { display: inline-grid; place-items: center; width: 1.2em; height: 1.2em; vertical-align: -.2em; margin-left: .22em; border-radius: 50%; overflow: hidden; background: var(--s2); outline: 2.5px solid var(--green); outline-offset: 1.5px; }
.h-av svg, .h-av img { width: 100%; height: 100%; object-fit: cover; }
.sec { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: -.005em; margin: 26px 2px 12px; }

/* ---------- Buttons ---------- */
.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--s1); border: 1px solid var(--line); transition: transform .2s var(--ease), background .2s; flex: none; }
.icon-btn.sm { width: 34px; height: 34px; background: var(--s2); }
.icon-btn:hover { background: var(--s3); } .icon-btn:active, .btn:active, .chip:active { transform: scale(.94); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 700; transition: transform .2s var(--ease), box-shadow .3s, background .2s; }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 13.5px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 0 rgba(184,245,42,0); }
.btn.primary:hover { box-shadow: 0 8px 28px -6px rgba(184,245,42,.5); }
.btn.ghost { background: var(--s2); border: 1px solid var(--line); }
.btn.danger { background: #ff4d42; color: #fff; }
.btn.danger-ghost { background: rgba(255,77,66,.12); color: #ff6b60; }
.link-btn { color: var(--accent-text); font-weight: 700; font-size: 13px; padding: 4px 2px; }
.chip { padding: 7px 14px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; transition: transform .2s var(--ease); }

/* =====================================================================
   BOTTOM NAV — floating pill, active item expands
   ===================================================================== */
.nav {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; padding: 7px; border-radius: 999px; max-width: calc(100vw - 24px);
  background: var(--nav-bg); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: 0 18px 40px -12px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.35);
}
.nav button {
  display: flex; align-items: center; height: 54px; min-width: 54px; padding: 0 16px; justify-content: center;
  border-radius: 999px; background: var(--nav-item); color: var(--nav-ink);
  transition: background .45s var(--ease), color .35s, padding .45s var(--ease), transform .25s var(--ease);
}
.nav button:active { transform: scale(.93); }
.nav .lbl { display: grid; grid-template-columns: 0fr; opacity: 0; transition: grid-template-columns .5s var(--ease), opacity .3s, margin .5s var(--ease); margin-left: 0; }
.nav .lbl > span { overflow: hidden; white-space: nowrap; font-weight: 700; font-size: 14.5px; transform: translateX(-6px); transition: transform .5s var(--ease); }
.nav button[aria-current="page"] { background: var(--nav-active); color: var(--nav-active-ink); padding: 0 22px 0 18px; }
.nav button[aria-current="page"] .lbl { grid-template-columns: 1fr; opacity: 1; margin-left: 9px; }
.nav button[aria-current="page"] .lbl > span { transform: none; }
.nav button[aria-current="page"] .i { animation: navPop .5s var(--ease); }
@keyframes navPop { 0% { transform: scale(.7) rotate(-12deg); } 60% { transform: scale(1.15); } 100% { transform: none; } }
.nav button:focus-visible { outline-offset: 3px; }

/* =====================================================================
   HOME
   ===================================================================== */
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top, 0px)) 0 4px; }
.top-pill { display: flex; align-items: center; gap: 8px; padding: 5px 5px 5px 14px; background: var(--s1); border: 1px solid var(--line); border-radius: 999px; font-weight: 700; }
.top-pill .plus { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: transform .25s var(--ease), box-shadow .3s; }
.top-pill .plus:hover { box-shadow: 0 0 18px rgba(184,245,42,.55); transform: rotate(90deg); }
.profile { text-align: center; padding: 10px 0 20px; }
.profile h1 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; margin-top: 16px; }
.avatar { position: relative; width: 104px; height: 104px; border-radius: 50%; display: block; margin: 0 auto; padding: 0; }
.avatar::before { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 2px dashed var(--accent); animation: spin 22s linear infinite; }
.avatar::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; box-shadow: 0 0 28px rgba(184,245,42,.28); pointer-events: none; }
.avatar-in { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--s2); display: grid; place-items: center; }
.avatar-in img, .avatar-in svg { width: 100%; height: 100%; object-fit: cover; }
.char-layer[data-mood="neutral"] img { filter: grayscale(1) opacity(.75); }
.av-char { display: block; width: 100%; height: 100%; padding: 6%; }
.av-char img, .av-char svg, .h-av img, .crew-av img, .side img, .day .art img { object-fit: contain; }
.h-av img, .h-av svg { padding: 6%; }
img { height: auto; } .char-layer img, .bg-layer img, .av-char img, .crew-av img, .side img, .day .art img, .h-av img { height: 100%; }
.avatar.sm { width: 60px; height: 60px; margin: 0; } .avatar.sm::before { inset: -5px; }
.avatar.big { width: 112px; height: 112px; }
@keyframes spin { to { transform: rotate(360deg); } }

.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 0; }
.st { display: grid; justify-items: center; gap: 2px; padding: 4px 6px; position: relative; }
.st + .st::before { content: ''; position: absolute; left: 0; top: 14%; height: 72%; width: 1px; background: var(--line); }
.st .ac { color: var(--accent-text); margin-bottom: 3px; }
.st b { font-size: 21px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.st span { font-size: 12.5px; color: var(--muted); }
.xp-line { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 12px; color: var(--muted); margin: 8px 0 18px; }
.xp-bar { width: 90px; height: 5px; border-radius: 9px; background: var(--s3); overflow: hidden; }
.xp-bar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; transition: width .8s var(--ease); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
.wd { display: grid; justify-items: center; align-content: center; gap: 5px; height: 88px; border-radius: 18px; background: var(--s1); border: 1.5px solid transparent; color: var(--muted); transition: transform .3s var(--ease), border-color .3s, background .3s; }
.wd span { font-size: 12px; } .wd b { font-size: 17px; color: var(--text); font-weight: 600; }
.wd-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); transition: background .3s, transform .3s; }
.wd.m-excellent .wd-dot, .wd.m-good .wd-dot { background: var(--green); } .wd.m-average .wd-dot { background: var(--yellow); } .wd.m-low .wd-dot { background: var(--red); }
.wd.sel { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); } .wd.sel .wd-dot { transform: scale(1.5); }
.wd.today:not(.sel) b { color: var(--accent-text); }
.wd:active { transform: scale(.94); }

.home-grid { display: grid; gap: 0; }
.home-col { display: grid; gap: 12px; align-content: start; }
.home-col + .home-col { margin-top: 12px; }
.row-cards { display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; }
.crew { padding: 16px 12px; display: grid; justify-items: center; align-content: center; gap: 4px; text-align: center; min-height: 148px; }
.crew-av { display: flex; margin-bottom: 8px; }
.crew-av span { width: 46px; height: 46px; border-radius: 50%; background: var(--s2); border: 2.5px solid var(--s1); overflow: hidden; margin-left: -14px; position: relative; z-index: calc(3 - var(--i)); }
.crew-av span:first-child { margin-left: 0; }
.crew-av svg, .crew-av img { width: 100%; height: 100%; }
.keep { position: relative; overflow: hidden; padding: 16px 14px 16px 16px; display: flex; align-items: stretch; min-height: 148px; background: linear-gradient(135deg, var(--s1) 40%, rgba(184,245,42,.14)); }
.keep-txt { display: grid; align-content: space-between; gap: 6px; position: relative; z-index: 1; max-width: 62%; }
.keep-txt strong { font-size: 18px; letter-spacing: -.02em; }
.keep-dots { display: flex; gap: 5px; } .keep-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--s3); } .keep-dots i.on { background: var(--accent); box-shadow: 0 0 8px rgba(184,245,42,.6); }
.trophy { position: absolute; right: -10px; bottom: -6px; width: 112px; transform: rotate(8deg); filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); transition: transform .5s var(--ease); }
.keep:hover .trophy { transform: rotate(2deg) scale(1.06); }
.banner { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 18px 14px 6px; overflow: hidden; text-align: left; width: 100%; transition: transform .3s var(--ease), border-color .3s; }
.banner:hover { transform: translateY(-2px); border-color: rgba(184,245,42,.35); } .banner:active { transform: scale(.98); }
.banner-art { width: 112px; flex: none; margin-left: -4px; } .banner-txt { display: grid; gap: 3px; }
.banner-txt strong { font-size: 17px; letter-spacing: -.02em; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: grid; gap: 6px; align-content: start; text-align: left; min-height: 124px; transition: transform .3s var(--ease), border-color .3s; }
button.info:hover { border-color: rgba(184,245,42,.3); } button.info:active { transform: scale(.97); }
.info-k { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.info strong { font-size: 15px; line-height: 1.25; }
.big { font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; display: block; }
.ring-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; } .ring-row > div { display: grid; gap: 4px; }
.bar { display: block; height: 6px; border-radius: 9px; background: var(--s3); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; transition: width .8s var(--ease); }
.msq { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin: 2px 0; }
.ms { aspect-ratio: 1; border-radius: 3px; background: var(--s3); } .ms.today { outline: 1.5px solid var(--text); outline-offset: 1px; }
.ms.m-excellent { background: var(--violet); } .ms.m-good { background: var(--green); } .ms.m-average { background: var(--yellow); } .ms.m-low { background: var(--red); } .ms.m-neutral { background: var(--s3); }
.road { display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; text-align: left; transition: transform .3s var(--ease), border-color .3s; }
.road:hover { border-color: rgba(184,245,42,.3); } .road:active { transform: scale(.98); }
.road-txt { display: grid; gap: 2px; flex: 1; min-width: 0; } .road-txt strong { font-size: 15.5px; }

/* =====================================================================
   TASKS — illustrated hero + panel
   ===================================================================== */
.hero { position: relative; border-radius: var(--r-xl); overflow: hidden; background: var(--panel); border: 1px solid var(--line); isolation: isolate; }
.hero-art { position: relative; height: 330px; overflow: hidden; }
.bg-stack, .bg-layer { position: absolute; inset: 0; }
.bg-layer { opacity: 0; transition: opacity .7s var(--ease); } .bg-layer.on { opacity: 1; }
.bg-layer svg, .bg-layer img { width: 100%; height: 100%; object-fit: cover; }
.hero-top { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; z-index: 3; }
.hero-right { display: flex; gap: 8px; }
.glass { background: rgba(255,255,255,.16); backdrop-filter: blur(14px) saturate(170%); -webkit-backdrop-filter: blur(14px) saturate(170%); border: 1px solid rgba(255,255,255,.3); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 20px -8px rgba(0,0,0,.35); color: #fff; }
.glass.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; transition: transform .25s var(--ease), background .25s; }
.glass.round:hover { background: rgba(255,255,255,.26); } .glass.round:active { transform: scale(.9); }
.pill-g { display: flex; align-items: center; gap: 6px; padding: 0 14px 0 11px; height: 42px; border-radius: 999px; font-weight: 800; }
.bubble { position: absolute; z-index: 3; top: 66px; left: 16px; max-width: 58%; background: #fff; color: #15171a; font-size: 12.5px; font-weight: 600; line-height: 1.3; padding: 9px 12px; border-radius: 16px 16px 16px 4px; box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); animation: bub .5s var(--ease); }
@keyframes bub { from { transform: scale(.85) translateY(6px); opacity: 0; } }
.char-stack { position: absolute; z-index: 2; left: 50%; bottom: 66px; width: 214px; height: 214px; transform: translateX(-50%); filter: drop-shadow(0 14px 18px rgba(0,0,0,.35)); }
.char-layer { position: absolute; inset: 0; opacity: 0; transform: scale(.82) translateY(16px); transition: opacity .35s, transform .55s var(--ease); pointer-events: none; }
.char-layer.on { opacity: 1; transform: none; animation: bob 4.5s ease-in-out .6s infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.char-layer svg, .char-layer img { width: 100%; height: 100%; object-fit: contain; }
.segs { position: absolute; z-index: 3; left: 50%; bottom: 70px; transform: translateX(-50%); display: flex; gap: 6px; }
.segs i { width: 30px; height: 6px; border-radius: 9px; background: rgba(255,255,255,.28); transition: background .4s, transform .4s var(--ease); }
.segs i.on { background: var(--seg); transform: scaleY(1.2); box-shadow: 0 0 10px var(--seg); }
.perfect { position: absolute; z-index: 3; right: 16px; bottom: 76px; display: flex; align-items: center; gap: 5px; padding: 6px 11px 6px 8px; border-radius: 999px; background: var(--green); color: #05260f; font-size: 12px; font-weight: 800; opacity: 0; transform: scale(.7); transition: opacity .3s, transform .5s var(--ease); }
.perfect.show { opacity: 1; transform: none; }

.panel { position: relative; z-index: 4; margin-top: -48px; padding: 12px 16px 16px; background: var(--panel); border-radius: 32px 32px 0 0; box-shadow: 0 -18px 30px -12px rgba(0,0,0,.35); }
[data-theme="light"] .panel { box-shadow: 0 -18px 30px -16px rgba(0,0,0,.2); }
.panel-grab { width: 38px; height: 4px; border-radius: 9px; background: var(--s3); margin: 0 auto 14px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; }
.day-switch { display: flex; align-items: center; gap: 6px; } .day-switch h2 { font-size: 24px; font-weight: 800; letter-spacing: -.03em; min-width: 88px; text-align: center; }
.count { font-size: 30px; font-weight: 800; letter-spacing: -.04em; color: var(--mood, var(--muted)); font-variant-numeric: tabular-nums; transition: color .5s; text-shadow: 0 0 22px color-mix(in srgb, var(--mood, transparent) 40%, transparent); }
.panel-sub { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; min-height: 28px; }
.the { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; color: var(--muted); }
.task-list { display: grid; gap: 2px; }
.task { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-radius: 14px; transition: background .2s; }
.task:hover { background: var(--s1); }
.chk { width: 28px; height: 28px; border-radius: 50%; flex: none; border: 2px solid var(--faint); display: grid; place-items: center; color: transparent; transition: background .3s var(--ease), border-color .3s, color .2s, transform .3s var(--ease); }
.chk .i { stroke-width: 3.2; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .4s var(--ease) .08s; }
.chk:hover { border-color: var(--green); } .chk:active { transform: scale(.85); }
.task.done .chk { background: var(--green); border-color: var(--green); color: #04210d; } .task.done .chk .i { stroke-dashoffset: 0; }
.task.pop .chk { animation: chkPop .55s var(--ease); }

/* =====================================================================

.side:hover { opacity: .85; transform: scale(.9); filter: none; } .side > span { width: 78px; height: 78px; border-radius: 50%; background: var(--s2); overflow: hidden; padding: 6px; display: block; }

.cal-meta { text-align: center; padding: 26px 8px 0; display: grid; gap: 3px; }
.cal-meta h2 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }

.status.m-excellent { color: var(--violet); } .status.m-good { color: var(--indigo); } .status.m-average { color: var(--orange); } .status.m-low { color: var(--red); } .status.m-neutral { color: var(--muted); }
.cal-month { padding: 16px 12px 14px; }

.blank { display: block; }
.day { display: flex; flex-direction: column; align-items: center; justify-content: space-between; aspect-ratio: 1 / 1.6; padding: 5px 0 7px; border-radius: 13px; background: var(--s2); border: 1.5px solid transparent; transition: transform .25s var(--ease), border-color .25s, background .25s; min-width: 0; }

.day.today .n { color: var(--accent-text); font-weight: 800; }

/* =====================================================================

   ===================================================================== */

.form input:focus, .form select:focus, .form textarea:focus, .sel-input:focus, .tt-line input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* =====================================================================
   SHEETS, FORMS, TOASTS
   ===================================================================== */
.sheet-ov { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0); display: flex; align-items: flex-end; justify-content: center; transition: background .3s; }
.sheet-ov.open { background: rgba(0,0,0,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.sheet { width: 100%; max-width: 520px; max-height: 92dvh; overflow: auto; background: var(--s1); border: 1px solid var(--line); border-bottom: 0; border-radius: 30px 30px 0 0; padding: 8px 20px calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform .45s var(--ease); overscroll-behavior: contain; }
.sheet-ov.open .sheet { transform: none; }
.sheet-lg { max-width: 600px; }
.sheet-grab { width: 40px; height: 4px; border-radius: 9px; background: var(--s3); margin: 4px auto 10px; }

.hint { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); background: var(--s2); border-radius: 14px; padding: 10px 12px; }

.dchip { position: relative; } .dchip input { position: absolute; opacity: 0; } .dchip span { display: block; padding: 8px 13px; border-radius: 999px; background: var(--s2); border: 1.5px solid var(--line); font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all .25s var(--ease); }
.dchip input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .dchip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.av-edit { display: grid; justify-items: center; gap: 16px; padding: 8px 0 4px; } .av-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tabs { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--s2); margin-bottom: 14px; }
.tabs button { flex: 1; padding: 9px; border-radius: 999px; font-weight: 700; font-size: 13.5px; color: var(--muted); transition: background .3s, color .3s; } .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
[hidden] { display: none !important; }
.tt-day { display: grid; gap: 8px; padding: 12px; border-radius: 18px; background: var(--s2); } .tt-day b { font-size: 14px; }
.tt-line { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13px; color: var(--muted); } .tt-line span { grid-column: 1 / -1; } .tt-line input { background: var(--s1); padding: 8px 10px; min-height: 42px; min-width: 0; } .tt-line i { font-style: normal; }

.rt-list { display: grid; gap: 6px; margin: 12px 0; } .rt-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--s2); text-align: left; width: 100%; transition: background .2s; } .rt-row:hover { background: var(--s3); } .rt-row > span { flex: 1; display: grid; min-width: 0; } .rt-row small { color: var(--muted); font-size: 12px; }
.rm-course { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 10px; } .rm-course > div:first-child { display: grid; } .rm-course small { color: var(--muted); font-size: 12.5px; }

.sub-h { font-size: 14px; font-weight: 700; margin: 20px 0 10px; } .sub-h small { color: var(--muted); font-weight: 600; margin-left: 6px; }
.stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; counter-reset: s; } .stages li { display: grid; gap: 2px; padding: 10px 8px; border-radius: 14px; background: var(--s2); font-size: 11.5px; color: var(--muted); line-height: 1.25; } .stages b { color: var(--text); font-size: 13px; }

.rm-row input { position: absolute; opacity: 0; } .rm-box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--faint); display: grid; place-items: center; color: transparent; flex: none; transition: all .3s var(--ease); }
.rm-row input:checked + .rm-box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .rm-row input:checked ~ span:last-child { color: var(--muted); text-decoration: line-through; } .rm-row input:focus-visible + .rm-box { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Persian RTL layout hardening: prevent text/image collisions in cards and responsive rows. */

html[lang="fa"] .wrap, html[lang="fa"] .page { direction: rtl; }

html[lang="fa"] .home-grid, html[lang="fa"] .row-cards, html[lang="fa"] .info-grid,
html[lang="fa"] .profile, html[lang="fa"] .sec { direction: rtl; }

html[lang="fa"] .banner-txt strong { line-height: 1.5; letter-spacing: 0; }

  <script>
/* =====================================================================
   STORE — dates, state, persistence, progress rules.
   All dates are LOCAL "YYYY-MM-DD" strings (never UTC ISO strings).
   ===================================================================== */
const STORE_KEY = 'streakwise-v1';

/* ---------- Date helpers (local time) ---------- */
const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dateKey(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); };
const diffDays = (a, b) => {
  const A = parseKey(a), B = parseKey(b);
  return Math.round((Date.UTC(A.getFullYear(), A.getMonth(), A.getDate()) - Date.UTC(B.getFullYear(), B.getMonth(), B.getDate())) / 864e5);
};
const weekdayId = k => DAYS[parseKey(k).getDay()];
const isValidKey = k => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && dateKey(parseKey(k)) === k;
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

function weekStartKey(k) {
  const start = WEEK_START_INDEX[S.settings.weekStart] ?? 6;
  const diff = (parseKey(k).getDay() - start + 7) % 7;
  return addDays(k, -diff);
}
function weekKeys(k) { const s = weekStartKey(k); return Array.from({ length: 7 }, (_, i) => addDays(s, i)); }
function monthKeys(y, m) { return Array.from({ length: daysInMonth(y, m) }, (_, i) => `${y}-${pad(m + 1)}-${pad(i + 1)}`); }

function relativeLabel(k) {
  const d = diffDays(k, todayKey());
  const fa = S?.settings?.language === 'fa';
  if (d === 0) return fa ? 'امروز' : 'Today';
  if (d === -1) return fa ? 'دیروز' : 'Yesterday';
  if (d === -2) return fa ? '۲ روز پیش' : '2 days ago';
  if (d === 1) return fa ? 'فردا' : 'Tomorrow';
  const dt = parseKey(k);
  return `${DAY_SHORT[DAYS[dt.getDay()]]}, ${MONTHS[dt.getMonth()].slice(0, 3)} ${dt.getDate()}`;
}
function longDate(k) {
  const dt = parseKey(k);
  if (S?.settings?.language === 'fa') return `${DAY_FULL[DAYS[dt.getDay()]]}، ${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
  return `${DAY_FULL[DAYS[dt.getDay()]]}, ${MONTHS[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
}

/* ---------- State ---------- */
let S;                 // the whole persisted state
let byDate = new Map(); // date -> sorted task array (derived index)
let storageOK = true;

function defaultState() {
  return {
    v: 1,
    profile: { name: 'My Profile', username: '@myprofile', avatar: null },
    settings: { theme: 'dark', sound: false, animations: true, weekStart: 'sat', streakThreshold: 100, coach: 'Rudy', language: 'en' },

    roadmap: { videos: 0, done: {} },

}

const str = (v, max, fb = '') => (typeof v === 'string' ? v.trim().slice(0, max) : fb);

/* Make any object (stored or imported) safe to use. */
function normalize(raw) {
  const d = defaultState();
  if (!raw || typeof raw !== 'object') return d;
  const o = d;
  if (raw.profile && typeof raw.profile === 'object') {
    o.profile.name = str(raw.profile.name, 24, d.profile.name) || d.profile.name;
    o.profile.username = str(raw.profile.username, 25, d.profile.username) || d.profile.username;
    o.profile.avatar = typeof raw.profile.avatar === 'string' && raw.profile.avatar.startsWith('data:image/') && raw.profile.avatar.length < 600000 ? raw.profile.avatar : null;
  }
  if (raw.settings && typeof raw.settings === 'object') {
    const s = raw.settings;
    if (['dark', 'light', 'amoled'].includes(s.theme)) o.settings.theme = s.theme;
    o.settings.sound = !!s.sound;
    o.settings.animations = s.animations !== false;
    if (WEEK_START_INDEX[s.weekStart] !== undefined) o.settings.weekStart = s.weekStart;
    if ([50, 75, 100].includes(s.streakThreshold)) o.settings.streakThreshold = s.streakThreshold;
    o.settings.coach = str(s.coach, 14, 'Rudy') || 'Rudy';

  }
  const okTime = t => typeof t === 'string' && /^\d{2}:\d{2}$/.test(t);
  if (raw.schedule && typeof raw.schedule === 'object') {
    ['school', 'english'].forEach(kind => DAYS.forEach(day => {

  });

    o.tasks = raw.tasks.filter(t => t && typeof t === 'object' && str(t.title, 80) && isValidKey(t.date)).slice(0, 20000).map(t => ({
      id: str(t.id, 40) || uid(),
      title: str(t.title, 80), description: str(t.description, 160),
      date: t.date,
      category: CATEGORIES[t.category] ? t.category : 'other',
      completed: !!t.completed,
      completedAt: typeof t.completedAt === 'string' ? t.completedAt : null,
      recurring: !!t.recurring,
      routineId: typeof t.routineId === 'string' ? t.routineId : null,
      edited: !!t.edited,
      order: Number.isFinite(t.order) ? t.order : 60,
      jsStage: JS_STAGES.some(s => s.id === t.jsStage) ? t.jsStage : null,
      startTime: /^\d{2}:\d{2}$/.test(t.startTime || '') ? t.startTime : '', endTime: /^\d{2}:\d{2}$/.test(t.endTime || '') ? t.endTime : '',
      createdAt: typeof t.createdAt === 'string' ? t.createdAt : new Date().toISOString()
    }));
  }
  // Migrate uncompleted class entries in today/future from the old default time.
  o.tasks.forEach(t => {
    if (t.routineId === 'sys:english' && !t.completed && !t.edited && t.date >= todayKey()) {
      const wd = weekdayId(t.date), slot = o.schedule.english[wd];
      if (slot) { t.startTime = slot[0]; t.endTime = slot[1]; }
    }
  });
  // Update uncompleted today/future task instances created from the old default timetable.
  // Preserve completed history and any task the user explicitly edited.
  o.tasks.forEach(t => {
    if (t.completed || t.edited || t.date < todayKey()) return;
    if (t.routineId === 'sys:english') {
      const slot = o.schedule.english[weekdayId(t.date)];
      if (slot) { t.startTime = slot[0]; t.endTime = slot[1]; }
    } else if (t.routineId) {
      const r = o.routines.find(x => x.id === t.routineId);
      if (r) { t.startTime = r.startTime || ''; t.endTime = r.endTime || ''; }
    }
  });
  // Backfill scheduled times for tasks created by earlier versions of this app.
  o.tasks.forEach(t => {
    if (t.startTime || t.endTime) return;
    const wd = weekdayId(t.date);
    if (t.routineId === 'sys:school' && o.schedule.school[wd]) [t.startTime, t.endTime] = o.schedule.school[wd];
    else if (t.routineId === 'sys:english' && o.schedule.english[wd]) [t.startTime, t.endTime] = o.schedule.english[wd];
    else if (t.routineId) { const r = o.routines.find(x => x.id === t.routineId); if (r) { t.startTime = r.startTime || ''; t.endTime = r.endTime || ''; } }
  });
  if (raw.materialized && typeof raw.materialized === 'object') {
    Object.keys(raw.materialized).forEach(k => { if (isValidKey(k) && raw.materialized[k]) o.materialized[k] = true; });
  }
  if (raw.roadmap && typeof raw.roadmap === 'object') {
    o.roadmap.videos = clamp(parseInt(raw.roadmap.videos, 10) || 0, 0, JS_COURSE.videos);
    if (raw.roadmap.done && typeof raw.roadmap.done === 'object') {
      Object.keys(raw.roadmap.done).forEach(k => { if (raw.roadmap.done[k] === true) o.roadmap.done[k] = true; });
    }
  }
  if (isValidKey(raw.installedOn)) o.installedOn = raw.installedOn;
  if (typeof raw.createdAt === 'string') o.createdAt = raw.createdAt;

}

function loadState() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { storageOK = false; }
  S = normalize(raw);
}
let saveWarned = false;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) {
    storageOK = false;
    if (!saveWarned && typeof toast === 'function') { saveWarned = true; toast('Could not save — browser storage is full or blocked.'); }
  }
}

function reindex() {
  byDate = new Map();
  S.tasks.forEach(t => { if (!byDate.has(t.date)) byDate.set(t.date, []); byDate.get(t.date).push(t); });
  byDate.forEach(list => list.sort((a, b) => a.order - b.order || a.createdAt.localeCompare(b.createdAt)));
}
function commit() { reindex(); save(); document.dispatchEvent(new CustomEvent('statechange')); }

const tasksOn = k => byDate.get(k) || [];

/* ---------- Routines → daily task instances ----------
   A day's tasks are created the first time the day is needed and never
   before the app was first used (no fake history). Each day is created once. */
function ensureDate(k) {
  if (S.materialized[k] || k < S.installedOn || diffDays(k, todayKey()) > 400) return false;
  const wd = weekdayId(k);
  const have = new Set(S.tasks.filter(t => t.date === k && t.routineId).map(t => t.routineId));
  const items = [];
  const sch = S.schedule.school[wd];
  if (sch && !have.has('sys:school')) items.push({ routineId: 'sys:school', title: 'School', description: 'School day', category: 'school', order: 10, startTime: sch[0], endTime: sch[1] });
  const en = S.schedule.english[wd];
  if (en && !have.has('sys:english')) items.push({ routineId: 'sys:english', title: 'English class', description: 'English course', category: 'english', order: 90, startTime: en[0], endTime: en[1] });
  S.routines.forEach(r => {
    if (r.days.includes(wd) && (!r.startDate || k >= r.startDate) && !have.has(r.id)) {
      items.push({ routineId: r.id, title: r.title, description: r.description, category: r.category, order: r.order, jsStage: r.jsStage || null, startTime: r.startTime || '', endTime: r.endTime || '' });
    }
  });
  items.forEach(it => S.tasks.push({
    id: uid(), date: k, completed: false, completedAt: null, recurring: true, edited: false,
    createdAt: new Date().toISOString(), jsStage: null, ...it
  }));
  S.materialized[k] = true;
  return true;
}
function prepare(keys) {
  let changed = false;
  keys.forEach(k => { if (ensureDate(k)) changed = true; });
  if (changed) { reindex(); save(); }
}
/* Fill every day from first use up to today so missed days count honestly. */
function backfillToToday() {
  const t = todayKey();
  let k = S.installedOn, guard = 0;
  const keys = [];
  while (k <= t && guard++ < 800) { keys.push(k); k = addDays(k, 1); }
  prepare(keys);
}
/* After a routine or timetable change: rebuild today + future days that are untouched. */
function refreshFuture() {
  const t = todayKey();
  S.tasks = S.tasks.filter(x => !(x.routineId && !x.completed && !x.edited && x.date >= t));
  Object.keys(S.materialized).forEach(k => { if (k >= t) delete S.materialized[k]; });
  reindex();
  prepare([t]);
}

/* ---------- Mutations ---------- */
function nextOrder(k) { const l = tasksOn(k); return l.length ? Math.max(...l.map(t => t.order)) + 10 : 10; }

function addTask({ title, description = '', date, category = 'other', startTime = '', endTime = '' }) {
  const t = {
    id: uid(), title, description, date, category, completed: false, completedAt: null,
    recurring: false, routineId: null, edited: false, jsStage: null, startTime, endTime,
    order: nextOrder(date), createdAt: new Date().toISOString()
  };
  S.tasks.push(t); commit(); return t;
}
function updateTask(id, patch) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const moved = patch.date && patch.date !== t.date;
  Object.assign(t, patch);
  if (moved) t.order = nextOrder(patch.date) + 1;
  if (t.routineId) t.edited = true;
  commit();
}
function deleteTask(id) { S.tasks = S.tasks.filter(t => t.id !== id); commit(); }
function toggleTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return null;
  t.completed = !t.completed;
  t.completedAt = t.completed ? new Date().toISOString() : null;
  commit(); return t;
}
function moveTask(id, dir) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const list = tasksOn(t.date).slice();
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((x, n) => { x.order = (n + 1) * 10; });
  commit();
}
function saveRoutine(r) {
  const i = S.routines.findIndex(x => x.id === r.id);
  if (i >= 0) S.routines[i] = r; else S.routines.push(r);
  refreshFuture(); commit();
}
function deleteRoutine(id) { S.routines = S.routines.filter(r => r.id !== id); refreshFuture(); commit(); }
function setSchedule(sch) { S.schedule = sch; refreshFuture(); commit(); }

function resetProgress() {
  S.tasks = []; S.materialized = {}; S.roadmap = { videos: 0, done: {} };
  S.installedOn = todayKey();
  reindex(); backfillToToday(); commit();
}
function clearAll() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  S = defaultState(); reindex(); backfillToToday(); commit();
}
function exportData() {
  return JSON.stringify({ app: 'streakwise', version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2);
}
function importData(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { throw new Error('That file is not valid JSON.'); }
  const data = obj && obj.app === 'streakwise' ? obj.data : null;
  if (!data || !Array.isArray(data.tasks) || typeof data.profile !== 'object') throw new Error('This is not a Streakwise export file.');
  S = normalize(data); reindex(); backfillToToday(); commit();
}

/* ---------- Progress rules ---------- */
/* Mood from a completion percentage:
   100 → excellent · 51–99 → good · 40–50 → average · <40 → low            */
function moodOfPct(p) { return p >= 100 ? 'excellent' : p > 50 ? 'good' : p >= 40 ? 'average' : 'low'; }

function dayInfo(k) {
  const list = tasksOn(k);
  const total = list.length, done = list.filter(t => t.completed).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const future = k > todayKey();
  let mood = 'neutral';
  if (total && !(future && done === 0)) mood = moodOfPct(pct);
  return { key: k, total, done, pct, mood, planned: !!total && future && done === 0, qualifies: total > 0 && pct >= S.settings.streakThreshold };
}

/* Streak: consecutive days WITH tasks that reach the threshold. Days with no tasks
   are skipped. Today does not break a streak until the day is over.             */
function streaks() {
  const today = todayKey();
  const dates = [...byDate.keys()].filter(k => k <= today && byDate.get(k).length).sort();
  let best = 0, run = 0;
  dates.forEach(k => { if (dayInfo(k).qualifies) { run++; best = Math.max(best, run); } else if (k !== today) run = 0; });
  let i = dates.length - 1;
  if (i >= 0 && dates[i] === today && !dayInfo(today).qualifies) i--;
  let current = 0;
  for (; i >= 0 && dayInfo(dates[i]).qualifies; i--) current++;
  return { current, best: Math.max(best, current) };
}

/* XP: 10 per completed task + 25 per perfect day.
   Level L starts at 50·L·(L−1) XP (100, 300, 600, 1000 …). */
function levelFromXP(xp) {
  const L = Math.max(1, Math.floor((1 + Math.sqrt(1 + xp / 12.5)) / 2));
  const from = 50 * L * (L - 1), to = 50 * (L + 1) * L;
  return { level: L, xp, from, to, pct: Math.round((xp - from) / (to - from) * 100) };
}

function overview() {
  const today = todayKey();
  let total = 0, completed = 0, perfect = 0, active = 0;
  const pcts = [], byCat = {};
  byDate.forEach((list, k) => {
    total += list.length;
    const d = list.filter(t => t.completed).length;
    completed += d;
    if (d) active++;
    if (k <= today && list.length) { pcts.push(d / list.length * 100); if (d === list.length) perfect++; }
    list.forEach(t => { if (t.completed) byCat[t.category] = (byCat[t.category] || 0) + 1; });
  });
  let p30 = 0, d30 = 0;
  for (let i = 0; i < 30; i++) { const l = tasksOn(addDays(today, -i)); p30 += l.length; d30 += l.filter(t => t.completed).length; }
  const wk = weekKeys(today);
  let wp = 0, wd = 0; wk.forEach(k => { const l = tasksOn(k); wp += l.length; wd += l.filter(t => t.completed).length; });
  const st = streaks();
  const xp = completed * 10 + perfect * 25;
  return {
    total, completed, active, perfect, xp,
    level: levelFromXP(xp),
    rate30: p30 ? Math.round(d30 / p30 * 100) : 0,
    weekRate: wp ? Math.round(wd / wp * 100) : 0, weekDone: wd, weekTotal: wp,
    avg: pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : 0,
    streak: st.current, best: st.best,
    study: LEARNING_CATS.reduce((a, c) => a + (byCat[c] || 0), 0),
    code: byCat.programming || 0, english: byCat.english || 0, school: byCat.school || 0
  };
}

function nextTask() {
  const today = todayKey();
  for (let i = 0; i < 14; i++) {
    const k = addDays(today, i);
    prepare([k]);
    const t = tasksOn(k).find(x => !x.completed);
    if (t) return { task: t, date: k };
  }
  return null;
}

function roadmapProgress() {
  const all = [...JS_TOPICS, ...JS_NEXT];
  const done = all.filter(t => S.roadmap.done[t.id]).length;
  return { done, total: all.length, pct: Math.round(done / all.length * 100), videos: S.roadmap.videos };
}

function taskRow(t, i, n) {
  const c = CATEGORIES[t.category] || CATEGORIES.other;
  const tools = UI.manage
    ? `<span class="tools"><button type="button" class="tool" data-action="move-task" data-dir="-1" data-id="${t.id}" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${icon('up', 15)}</button>

       <button type="button" class="tool" data-action="edit-task" data-id="${t.id}" aria-label="Edit ${esc(t.title)}">${icon('pencil', 15)}</button>
       <button type="button" class="tool danger" data-action="del-task" data-id="${t.id}" aria-label="Delete ${esc(t.title)}">${icon('trash', 15)}</button></span>`
    : `<span class="tools"><button type="button" class="tool" data-action="edit-task" data-id="${t.id}" aria-label="Edit ${esc(t.title)}">${icon('pencil', 15)}</button></span>`;
  return `<li class="task ${t.completed ? 'done' : ''} ${UI.justToggled === t.id ? 'pop' : ''}">
    <button type="button" class="chk" role="checkbox" aria-checked="${t.completed}" aria-label="${esc(t.title)}" data-action="toggle-task" data-id="${t.id}">${icon('check', 15)}</button>
    <button type="button" class="task-main" tabindex="-1" data-action="toggle-task" data-id="${t.id}">

}

function updateTasks() {
  const k = UI.sel; prepare([k]);

</script>
  <script>
/* =====================================================================
   SHEETS — forms and dialogs (task, profile, timetable, routine, roadmap)
   ===================================================================== */
const catOptions = cur => Object.entries(CATEGORIES).map(([k, c]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${c.label}</option>`).join('');
const dayChips = (sel, name = 'days') => ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'].map(d =>
  `<label class="dchip"><input type="checkbox" name="${name}" value="${d}" ${sel.includes(d) ? 'checked' : ''}><span>${DAY_SHORT[d]}</span></label>`).join('');
const setErr = (form, name, msg) => {
  const e = $(`[data-err="${name}"]`, form); if (!e) return;
  e.textContent = msg || ''; e.hidden = !msg;
  const inp = form.elements[name]; if (inp && inp.setAttribute) inp.setAttribute('aria-invalid', msg ? 'true' : 'false');
};

/* ---------- Task: add / edit ---------- */
function taskSheet(id, date) {
  const t = id ? S.tasks.find(x => x.id === id) : null;
  if (id && !t) return;
  const d = t ? t.date : date;
  const canRepeat = !t && d >= todayKey();
  const routineNote = t && t.routineId ? `<p class="hint">${icon('info', 15)} Part of a weekly routine. Changes here apply to this day only.
      <button type="button" class="link-btn" data-action="edit-routine-of" data-id="${t.id}">Edit the routine</button></p>` : '';
  openSheet({
    title: t ? 'Edit task' : 'New task',
    html: `<form class="form" id="task-form" novalidate>
      <label class="field"><span>Title</span><input name="title" maxlength="80" required autocomplete="off" placeholder="e.g. Practise array methods" value="${esc(t ? t.title : '')}"><em class="err" data-err="title" hidden></em></label>
      <label class="field"><span>Description <small>optional</small></span><textarea name="description" maxlength="160" rows="2" placeholder="What exactly will you do?">${esc(t ? t.description : '')}</textarea></label>
      <div class="two">
        <label class="field"><span>Start time</span><input type="time" name="startTime" value="${esc(t ? t.startTime || '' : '')}"></label>
        <label class="field"><span>End time</span><input type="time" name="endTime" value="${esc(t ? t.endTime || '' : '')}"></label>
      </div>
      <div class="two">
        <label class="field"><span>Date</span><input type="date" name="date" required min="2000-01-01" max="2100-12-31" value="${d}"><em class="err" data-err="date" hidden></em></label>
        <label class="field"><span>Category</span><select name="category">${catOptions(t ? t.category : 'programming')}</select></label>
      </div>
      ${canRepeat ? `<fieldset class="field rep"><legend>Repeat</legend>
        <div class="seg"><label><input type="radio" name="repeat" value="none" checked><span>Just this day</span></label><label><input type="radio" name="repeat" value="weekly"><span>Every week</span></label></div>
        <div class="dchips" id="rep-days" hidden>${dayChips([weekdayId(d)])}</div><em class="err" data-err="days" hidden></em></fieldset>` : ''}
      ${routineNote}
      <div class="btn-row">${t ? `<button type="button" class="btn danger-ghost" data-action="del-task" data-id="${t.id}">Delete</button>` : ''}<button class="btn primary" type="submit">${t ? 'Save changes' : 'Add task'}</button></div>
    </form>`,
    onMount(el) {
      const form = $('#task-form', el);
      $$('input[name=repeat]', form).forEach(r => r.addEventListener('change', () => { $('#rep-days', form).hidden = form.elements.repeat.value !== 'weekly'; }));
      form.addEventListener('submit', e => {
        e.preventDefault();
        const title = form.elements.title.value.trim(), date = form.elements.date.value;
        let ok = true;
        setErr(form, 'title', title ? '' : 'Give the task a title.'); if (!title) ok = false;
        const validDate = isValidKey(date) && date >= '2000-01-01' && date <= '2100-12-31';
        setErr(form, 'date', validDate ? '' : 'Pick a valid date.'); if (!validDate) ok = false;
        const weekly = form.elements.repeat && form.elements.repeat.value === 'weekly';
        const days = weekly ? $$('#rep-days input:checked', form).map(i => i.value) : [];
        if (weekly) { setErr(form, 'days', days.length ? '' : 'Choose at least one day.'); if (!days.length) ok = false; }
        if (!ok) { const bad = $('[aria-invalid=true]', form) || $('.err:not([hidden])', form); if (bad && bad.focus) bad.focus(); return; }
        const startTime = form.elements.startTime.value, endTime = form.elements.endTime.value;
        const fields = { title, description: form.elements.description.value.trim(), category: form.elements.category.value, startTime, endTime };
        closeSheet();
        if (t) { updateTask(t.id, { ...fields, date }); toast('Task saved'); }
        else if (weekly) {
          saveRoutine({ id: uid(), ...fields, days, order: 55, startDate: date, jsStage: null });
          toast('Weekly task added');
        } else { addTask({ ...fields, date }); toast('Task added'); }
        setSelected(date);
      });
    }
  });
}

/* ---------- Profile ---------- */
function processImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('Choose an image file.'));
    if (file.size > 12 * 1024 * 1024) return reject(new Error('That image is over 12 MB.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = 256;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
    img.src = url;
  });
}

const TT_ORDER = ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'];
function timetableSheet(tab = 'schedule') {
  const sch = S.schedule;
  const timeIn = (kind, d, i) => `<input type="time" name="${kind}-${d}-${i}" value="${sch[kind][d] ? sch[kind][d][i] : ''}" aria-label="${kind === 'school' ? 'School' : 'English class'} ${i ? 'end' : 'start'} on ${DAY_FULL[d]}">`;
  const rows = TT_ORDER.map(d => `<div class="tt-day"><b>${DAY_FULL[d]}</b>
      <div class="tt-line"><span>School</span>${timeIn('school', d, 0)}<i>–</i>${timeIn('school', d, 1)}</div>
      <div class="tt-line"><span>English class</span>${timeIn('english', d, 0)}<i>–</i>${timeIn('english', d, 1)}</div></div>`).join('');
  const routines = S.routines.slice().sort((a, b) => a.title.localeCompare(b.title)).map(r => {
    const c = CATEGORIES[r.category];
    return `<button type="button" class="rt-row" data-action="edit-routine" data-id="${esc(r.id)}"><i class="t-cat" style="--c:${c.color}"></i>
      <span><b>${esc(r.title)}</b><small>${r.days.length === 7 ? 'Every day' : TT_ORDER.filter(d => r.days.includes(d)).map(d => DAY_SHORT[d]).join(' · ') || 'No days'}${r.startTime ? ` · ${r.startTime}–${r.endTime || '—'}` : ''}</small></span>${icon('right', 16, 'muted')}</button>`;
  }).join('');
  openSheet({
    title: 'Timetable & routines', cls: 'sheet-lg',
    html: `<div class="tabs" role="tablist"><button type="button" role="tab" data-tab="schedule" aria-selected="${tab === 'schedule'}">Weekly schedule</button><button type="button" role="tab" data-tab="routines" aria-selected="${tab === 'routines'}">Routines</button></div>
      <form id="tt-form" class="form tt" data-panel="schedule" ${tab === 'schedule' ? '' : 'hidden'} novalidate>
        <p class="muted sm">Leave both times empty for a day without school or class. Changes apply from today onward; past days stay as they were.</p>
        ${rows}<em class="err" id="tt-err" hidden></em>
        <div class="btn-row"><button class="btn primary" type="submit">Save schedule</button></div></form>
      <div data-panel="routines" ${tab === 'routines' ? '' : 'hidden'}>
        <p class="muted sm">Routines repeat on the days you choose. School and English class come from the weekly schedule.</p>
        <div class="rt-list">${routines || '<p class="muted">No routines yet.</p>'}</div>
        <div class="btn-row"><button type="button" class="btn primary" data-action="edit-routine" data-id="">${icon('plus', 16)} New routine</button></div></div>`,
    onMount(el) {
      $$('[data-tab]', el).forEach(b => b.addEventListener('click', () => {
        $$('[data-tab]', el).forEach(x => x.setAttribute('aria-selected', x === b));
        $$('[data-panel]', el).forEach(p => { p.hidden = p.dataset.panel !== b.dataset.tab; });
      }));
      $('#tt-form', el).addEventListener('submit', e => {
        e.preventDefault();
        const f = e.target, next = { school: {}, english: {} }, err = $('#tt-err', el);
        for (const kind of ['school', 'english']) for (const d of DAYS) {
          const a = f.elements[`${kind}-${d}-0`].value, b = f.elements[`${kind}-${d}-1`].value;
          if (!a && !b) { next[kind][d] = null; continue; }
          if (!a || !b || b <= a) {
            err.textContent = `${DAY_FULL[d]}: ${kind === 'school' ? 'school' : 'English class'} needs a start time and a later end time, or leave both empty.`; err.hidden = false;
            f.elements[`${kind}-${d}-${!a ? 0 : 1}`].focus(); return;
          }
          next[kind][d] = [a, b];
        }
        err.hidden = true; closeSheet(); setSchedule(next); toast('Schedule saved');
      });
    }
  });
}

        toast('Routine saved'); timetableSheet('routines');
      });
    }
  });
}

        $('#rm-a', el).textContent = `${JS_NEXT.filter(t => S.roadmap.done[t.id]).length}/${JS_NEXT.length}`;
        inp.value = v;
      };
      const setV = v => { S.roadmap.videos = clamp(Math.round(Number(v)) || 0, 0, JS_COURSE.videos); save(); paint(); if (UI.page === 'home') renderHome(); };
      $('#vid-minus', el).addEventListener('click', () => setV(S.roadmap.videos - 1));

      inp.addEventListener('change', () => setV(inp.value));
      $$('[data-rm]', el).forEach(c => c.addEventListener('change', () => {
        if (c.checked) S.roadmap.done[c.dataset.rm] = true; else delete S.roadmap.done[c.dataset.rm];
        save(); paint(); if (UI.page === 'home') renderHome();
      }));
      paint();
    }
  });
}

میزان کارهایی که انجام داده‌ای، بازخورد می‌دهد.','Progress here means real, completed tasks and the consistency behind them. It is a tool for building a record of steady work on your studies, your code and your portfolio. It does not predict admissions or scholarships, and finishing a checklist is never a guarantee of either. Rest, sleep and free time count too.':'پیشرفت در این برنامه یعنی انجام واقعی وظایف و استمرار در آن‌ها. این ابزار به تو کمک می‌کند سابقه‌ای از تلاش پیوسته در درس، برنامه‌نویسی و نمونه‌کارت بسازی. این برنامه پذیرش یا بورسیه را پیش‌بینی نمی‌کند و تکمیل چک‌لیست تضمینی برای آن‌ها نیست. استراحت، خواب و زمان آزاد هم اهمیت دارند.',
    'Title':'عنوان','Description':'توضیحات','optional':'اختیاری','Date':'تاریخ','Category':'دسته‌بندی','Start time':'زمان شروع','End time':'زمان پایان','Repeat':'تکرار','Just this day':'فقط همین روز','Every week':'هر هفته','Add routine':'افزودن روتین','Save routine':'ذخیره روتین','Save changes':'ذخیره تغییرات','New task':'وظیفه جدید','Edit task':'ویرایش وظیفه','Delete':'حذف','School':'مدرسه','English class':'کلاس زبان انگلیسی','Programming':'برنامه‌نویسی','English':'انگلیسی','Health':'سلامت','Review':'مرور','Other':'سایر','Homework & school review':'تکالیف و مرور درس‌ها','Finish assignments first, then review today’s lessons':'ابتدا تکالیف را انجام بده و سپس درس‌های امروز را مرور کن','Learn a new JavaScript topic':'یادگیری مبحث جدید جاوااسکریپت','Watch one lesson, then code it yourself':'یک درس ببین و سپس خودت کدنویسی کن','JavaScript exercises & practice':'تمرین و حل مسئله جاوااسکریپت','Solve problems without the video running':'بدون تماشای ویدئو مسئله حل کن','JavaScript review & practice':'مرور و تمرین جاوااسکریپت','Revisit older topics, fix weak spots':'مباحث قبلی را مرور و نقاط ضعف را برطرف کن','Short English practice':'تمرین کوتاه انگلیسی','20 minutes: vocabulary, reading or listening':'۲۰ دقیقه: واژگان، خواندن یا شنیدن','Meals, rest & free time':'غذا، استراحت و زمان آزاد','Deep JavaScript study':'مطالعه عمیق جاوااسکریپت','Independent coding exercises':'تمرین کدنویسی مستقل','Personal programming project':'پروژه شخصی برنامه‌نویسی','English practice':'تمرین انگلیسی','Exercise & rest':'ورزش و استراحت','Weekly JavaScript quiz':'آزمون هفتگی جاوااسکریپت','Review mistakes':'مرور اشتباهات','Improve personal project':'بهبود پروژه شخصی','GitHub update':'به‌روزرسانی گیت‌هاب','English writing or speaking':'نوشتن یا صحبت کردن انگلیسی','Weekly review & rest':'مرور هفتگی و استراحت','Sleep 8–10 hours':'۸ تا ۱۰ ساعت خواب','School day':'روز مدرسه','English course':'کلاس زبان','Language / زبان':'زبان','English or فارسی':'انگلیسی یا فارسی','Choose at least one day.':'حداقل یک روز را انتخاب کن.','Give the task a title.':'برای وظیفه یک عنوان بنویس.','Pick a valid date.':'یک تاریخ معتبر انتخاب کن.','Task saved':'وظیفه ذخیره شد','Task added':'وظیفه اضافه شد','Routine saved':'روتین ذخیره شد','Schedule saved':'برنامه ذخیره شد','Delete task':'حذف وظیفه','Could not save — browser storage is full or blocked.':'ذخیره‌سازی انجام نشد؛ فضای مرورگر پر است یا دسترسی مسدود شده است.'
  }
};
const originalLocale = { short: {...DAY_SHORT}, full: {...DAY_FULL}, months: MONTHS.slice(), words: NUM_WORDS.slice() };
function applyLanguage() {
  const fa = S && S.settings && S.settings.language === 'fa';
  document.documentElement.lang = fa ? 'fa' : 'en';
  document.documentElement.dir = fa ? 'rtl' : 'ltr';
  document.body.classList.toggle('locale-fa', !!fa);
  if (typeof UI !== 'undefined' && typeof PAGE_TITLE !== 'undefined') document.title = `${fa ? ({home:'خانه',tasks:'وظایف',calendar:'تقویم',settings:'تنظیمات'}[UI.page] || 'خانه') : (PAGE_TITLE[UI.page] || 'Home')} · Streakwise`;
  if (fa) {
    Object.assign(DAY_SHORT,{sun:'یکش',mon:'دوش',tue:'سه‌ش',wed:'چهار',thu:'پنج',fri:'جمعه',sat:'شنبه'});
    Object.assign(DAY_FULL,{sun:'یکشنبه',mon:'دوشنبه',tue:'سه‌شنبه',wed:'چهارشنبه',thu:'پنجشنبه',fri:'جمعه',sat:'شنبه'});
    ['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'].forEach((v,i)=>MONTHS[i]=v);
    ['صفر','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده','بیست'].forEach((v,i)=>NUM_WORDS[i]=v);
  } else {
    Object.assign(DAY_SHORT,originalLocale.short); Object.assign(DAY_FULL,originalLocale.full);
    MONTHS.splice(0,MONTHS.length,...originalLocale.months); NUM_WORDS.splice(0,NUM_WORDS.length,...originalLocale.words);
  }
  translateDocument();
}
function translateDocument(root=document) {
  const fa = S && S.settings && S.settings.language === 'fa';
  const dict = I18N.fa;
  const reverse = Object.fromEntries(Object.entries(dict).map(([en,faText])=>[faText,en]));
  const map = fa ? dict : reverse;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => { const v=n.nodeValue.trim(); if (map[v]) n.nodeValue=n.nodeValue.replace(v,map[v]); });
  root.querySelectorAll?.('[placeholder],[aria-label],[title]').forEach(el=>['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a); if(v&&map[v]) el.setAttribute(a,map[v]);}));
}
let i18nObserver;
function startI18nObserver(){
  if(i18nObserver) return;
  i18nObserver=new MutationObserver(records=>{ for(const r of records){ if(r.type==='childList') r.addedNodes.forEach(n=>{if(n.nodeType===1) translateDocument(n); else if(n.nodeType===3){const v=n.nodeValue.trim(); if(S?.settings?.language==='fa'&&I18N.fa[v]) n.nodeValue=n.nodeValue.replace(v,I18N.fa[v]);}}); }});
  i18nObserver.observe(document.body,{childList:true,subtree:true});
}

</script>
  <script>
/* =====================================================================
   APP — routing, events, boot
   ===================================================================== */
const PAGES = ['home', 'tasks', 'calendar', 'settings'];
const PAGE_TITLE = { home: 'Home', tasks: 'Tasks', calendar: 'Calendar', settings: 'Settings' };

function applyTheme() {
  const r = document.documentElement;
  r.dataset.theme = S.settings.theme;
  r.dataset.anim = animOn() ? 'on' : 'off';
  const m = $('meta[name=theme-color]');
  if (m) m.content = { dark: '#08090B', amoled: '#000000', light: '#EFF0EC' }[S.settings.theme];
}

function renderCurrent(dir = 0, monthDir = 0) {
  if (UI.page === 'home') renderHome();
  else if (UI.page === 'tasks') updateTasks();
  else if (UI.page === 'calendar') updateCalendar(dir, monthDir);
  else renderSettings();
}

function showPage(p) {
  if (!PAGES.includes(p)) p = 'home';
  UI.page = p; UI.manage = false;
  $$('.page').forEach(s => s.classList.toggle('active', s.dataset.page === p));
  $$('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.page === p ? 'page' : 'false'));
  document.title = `${S?.settings?.language === 'fa' ? ({home:'خانه',tasks:'وظایف',calendar:'تقویم',settings:'تنظیمات'}[p]) : PAGE_TITLE[p]} · Streakwise`;
  document.body.dataset.page = p;
  renderCurrent();
  window.scrollTo(0, 0);
}
function setPage(p) {
  if (location.hash.slice(1) === p) showPage(p); else location.hash = p;
}

function setSelected(k, opts = {}) {
  const dir = opts.dir ?? Math.sign(diffDays(k, UI.sel));
  const monthChanged = k.slice(0, 7) !== UI.viewMonth;
  UI.sel = k; UI.viewMonth = k.slice(0, 7);
  if (!opts.silent) tick();
  renderCurrent(dir, monthChanged ? dir : 0);
}
const stepDay = n => setSelected(addDays(UI.sel, n), { dir: n });

function shiftMonth(n) {
  const [y, m] = UI.viewMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  UI.viewMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  tick();
  renderMonthGrid();
  if (animOn()) $('#m-grid').animate([{ transform: `translateX(${n * 30}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.22,1,.36,1)' });
}

function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- Click actions (event delegation) ---------- */
const actions = {
  'close-sheet': () => closeSheet(),
  go: a => setPage(a.dataset.page),
  'sel-date': a => setSelected(a.dataset.date),
  'day-prev': () => stepDay(-1),
  'day-next': () => stepDay(1),
  'month-prev': () => shiftMonth(-1),
  'month-next': () => shiftMonth(1),
  'month-today': () => { const k = todayKey(); UI.viewMonth = k.slice(0, 7); setSelected(k); },
  'open-next': a => { UI.sel = a.dataset.date; UI.viewMonth = UI.sel.slice(0, 7); setPage('tasks'); },
  'add-task': () => taskSheet(null, UI.sel),
  'edit-task': a => taskSheet(a.dataset.id),
  'toggle-manage': () => { UI.manage = !UI.manage; updateTasks(); },
  'toggle-task': a => {
    const id = a.dataset.id, t = S.tasks.find(x => x.id === id); if (!t) return;
    const wasChk = a.classList.contains('chk');
    UI.justToggled = t.completed ? null : id;
    tick(t.completed ? 'soft' : 'done');
    toggleTask(id);
    if (wasChk) { const n = $(`.chk[data-id="${id}"]`); if (n) n.focus({ preventScroll: true }); }
    setTimeout(() => { UI.justToggled = null; }, 700);
  },
  'move-task': a => {
    const id = a.dataset.id, dir = Number(a.dataset.dir);
    moveTask(id, dir);
    const n = $(`[data-action="move-task"][data-id="${id}"][data-dir="${dir}"]`) || $(`[data-action="edit-task"][data-id="${id}"]`);
    if (n) n.focus({ preventScroll: true });
  },
  'del-task': async a => {
    const t = S.tasks.find(x => x.id === a.dataset.id); if (!t) return;
    const ok = await confirmDialog({ title: 'Delete this task?', message: `“${t.title}” will be removed from ${relativeLabel(t.date).toLowerCase()}.`, confirmLabel: 'Delete task', danger: true });
    if (ok) { deleteTask(t.id); toast('Task deleted'); }
  },
  'edit-routine-of': a => {
    const t = S.tasks.find(x => x.id === a.dataset.id); if (!t) return;
    if (t.routineId.startsWith('sys:')) timetableSheet('schedule'); else routineSheet(t.routineId);
  },
  'open-profile': () => profileSheet(),
  'open-timetable': () => timetableSheet(),
  'edit-routine': a => routineSheet(a.dataset.id || null),
  'open-roadmap': () => roadmapSheet(),
  'set-theme': a => { S.settings.theme = a.dataset.v; save(); applyTheme(); renderSettings(); },
  'toggle-sound': () => { S.settings.sound = !S.settings.sound; save(); renderSettings(); if (S.settings.sound) tick(); },
  'toggle-anim': () => { S.settings.animations = !S.settings.animations; save(); applyTheme(); renderSettings(); },
  export: () => { download(`streakwise-backup-${todayKey()}.json`, exportData()); toast('Backup downloaded'); },
  import: () => $('#file-import').click(),
  reset: async () => {
    const ok = await confirmDialog({ title: 'Reset progress?', message: 'This erases all task history, streaks and roadmap progress. Your profile, settings and routines stay. This cannot be undone.', confirmLabel: 'Reset progress', danger: true, requireText: 'RESET' });
    if (ok) { resetProgress(); UI.sel = todayKey(); UI.viewMonth = UI.sel.slice(0, 7); toast('Progress reset'); }
  },
  clear: async () => {
    const ok = await confirmDialog({ title: 'Clear all data?', message: 'Everything is deleted: tasks, history, routines, profile and settings. Export a backup first if you might want it back.', confirmLabel: 'Delete everything', danger: true, requireText: 'DELETE' });
    if (ok) { clearAll(); UI.sel = todayKey(); UI.viewMonth = UI.sel.slice(0, 7); applyTheme(); buildTasksPage(); buildCalendarPage(); renderCurrent(); toast('All data cleared'); }
  }
};

let swallowClick = false;
document.addEventListener('click', e => {
  if (!S) return;
  if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; return; }
  const a = e.target.closest('[data-action]');
  if (a && actions[a.dataset.action]) actions[a.dataset.action](a, e);
}, true);

document.addEventListener('change', e => {
  const sel = e.target.closest('[data-setting]'); if (!sel) return;
  const k = sel.dataset.setting;
  if (k === 'weekStart') S.settings.weekStart = sel.value;
  if (k === 'language') { S.settings.language = sel.value; save(); applyLanguage(); renderCurrent(); applyLanguage(); return; }
  if (k === 'streakThreshold') S.settings.streakThreshold = Number(sel.value);
  commit(); renderCurrent();
});

/* ---------- Swipe & keyboard on the day carousel ---------- */
let swipe = null;
document.addEventListener('pointerdown', e => { if (e.target.closest('#carousel')) swipe = { x: e.clientX, y: e.clientY }; });
document.addEventListener('pointercancel', () => { swipe = null; });
document.addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
  if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    stepDay(dx < 0 ? 1 : -1);
    swallowClick = true; setTimeout(() => { swallowClick = false; }, 60);
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'carousel') {
    if (e.key === 'ArrowLeft') { e.preventDefault(); stepDay(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); stepDay(1); }
  }
});

/* ---------- Import ---------- */
$('#file-import').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const text = await f.text();
    JSON.parse(text);
    const ok = await confirmDialog({ title: 'Import this backup?', message: 'Your current data will be replaced by the contents of the file.', confirmLabel: 'Replace my data', danger: true });
    if (!ok) return;
    importData(text);
    UI.sel = todayKey(); UI.viewMonth = UI.sel.slice(0, 7);
    applyTheme(); buildTasksPage(); buildCalendarPage(); renderCurrent(); toast('Backup imported');
  } catch (err) { toast(err.message || 'Import failed.'); }
});

document.addEventListener('statechange', () => renderCurrent());
window.addEventListener('hashchange', () => { if (S) showPage(location.hash.slice(1)); });

/* ---------- Boot ---------- */
function boot() {
  loadState(); reindex(); backfillToToday();
  startI18nObserver(); applyLanguage();
  applyTheme(); buildTasksPage(); buildCalendarPage();
  showPage(PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home');

  let lastToday = todayKey();
  setInterval(() => {                       // midnight rollover
    const t = todayKey(); if (t === lastToday) return;
    if (UI.sel === lastToday) { UI.sel = t; UI.viewMonth = t.slice(0, 7); }
    lastToday = t; backfillToToday(); commit();
  }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && todayKey() !== lastToday) { lastToday = todayKey(); backfillToToday(); commit(); } });
}

/* Check the configured image files first; any that fail to load fall back to the built-in SVG art. */
function preloadAssets() {
  const jobs = [];
  const check = (obj, key) => {
    const src = obj[key]; if (!src) return;
    jobs.push(new Promise(res => { const i = new Image(); i.onload = () => res(); i.onerror = () => { obj[key] = null; res(); }; i.src = src; }));
  };
  Object.keys(ASSETS.characterStates).forEach(k => check(ASSETS.characterStates, k));
  Object.keys(ASSETS.backgrounds).forEach(k => check(ASSETS.backgrounds, k));
  ['trophy', 'fire', 'avatar'].forEach(k => check(ASSETS, k));
  return Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 2500))]);
}
preloadAssets().then(boot);
